name: Adjusted official-derived validation

on:
  pull_request:
    paths:
      - 'adjusted/**'
      - 'official/raw/Promisory/**'
      - '.github/workflows/adjusted-runtime-validation.yml'
  push:
    branches: [main]
    paths:
      - 'adjusted/**'
      - 'official/raw/Promisory/**'
      - '.github/workflows/adjusted-runtime-validation.yml'

permissions:
  contents: read

jobs:
  official-derived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify official baseline and cloze round trip
        run: python3 -B adjusted/tools/check_official_cloze.py
      - name: PER cloze renderer tests
        run: python3 -B -m unittest discover -s adjusted/tests -v
      - name: Web workflow and consent-metering tests
        run: python3 -B -m unittest discover -s adjusted/tests/web_author -v
      - name: Web JavaScript syntax
        run: node --check adjusted/web-author/web/app.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Synthetic studio browser regression
        run: python adjusted/tests/web_author/test_wizard_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-review
          path: adjusted/.local/studio-review/
          retention-days: 7
