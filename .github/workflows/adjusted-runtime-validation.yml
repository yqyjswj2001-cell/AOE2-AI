name: Adjusted runtime validation

on:
  pull_request:
    paths:
      - 'adjusted/**'
      - '.github/workflows/adjusted-runtime-validation.yml'
  push:
    branches: [main]
    paths:
      - 'adjusted/**'
      - '.github/workflows/adjusted-runtime-validation.yml'

permissions:
  contents: read

jobs:
  adjusted-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check fixed runtime contract
        run: python3 -B adjusted/tools/check_fixed_runtime.py
      - name: Check dynamic strategy contract
        run: python3 -B adjusted/tools/check_dynamic_strategy.py
      - name: Dynamic strategy compiler tests
        run: python3 -B -m unittest discover -s adjusted/tests -v
      - name: Compile Franks dynamic strategy smoke test
        shell: bash
        run: |
          rm -rf /tmp/aoe2-dynamic
          python3 -B adjusted/tools/compile_dynamic_strategy.py \
            adjusted/examples/franks.dynamic-strategy.v1.json \
            --out /tmp/aoe2-dynamic
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/aoe2-dynamic")
          manifest=json.loads((root/"MANIFEST.json").read_text())
          expected={
              "scoutcontrol.per","gatherers.per","units.per","buildings.per",
              "escrow.per","trade.per","threats.per","tsa.per","orb.per",
          }
          assert {p.name for p in root.glob("*.per")}==expected
          assert set(manifest["generated_modules"])==expected
          print("dynamic compiler smoke PASS", len(expected), "modules")
          PY
