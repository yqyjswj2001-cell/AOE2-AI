name: Web author review
on:
  push:
    branches: [work/web-author-redesign]
permissions:
  contents: write
jobs:
  review:
    if: contains(github.event.head_commit.message, 'Apply reviewed studio source')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed readable edits with exact baseline and result hashes
        run: |
          python - <<'PY'
          import hashlib, runpy, subprocess
          from pathlib import Path
          pending = []
          def edit(name, before, after, ops):
              target = Path(name)
              assert not target.is_absolute() and '..' not in target.parts
              assert name == 'SKILL.md' or name.startswith(('adjusted/web-author/', 'adjusted/skills/aoe2-web-author/', 'adjusted/tests/web_author/'))
              raw = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(raw).hexdigest() == before, name + ': baseline changed'
              lines = raw.decode('utf-8').replace('\r\n', '\n').splitlines(keepends=True)
              for start, end, text in reversed(ops):
                  lines[start:end] = [text]
              out = ''.join(lines).encode('utf-8')
              if raw.count(b'\r\n') and raw.count(b'\r\n') == raw.count(b'\n'):
                  out = out.replace(b'\n', b'\r\n')
              assert hashlib.sha256(out).hexdigest() == after, name + ': output differs'
              pending.append((target, out))
          scripts = sorted(Path('.github/studio-publication').glob('*.py'))
          assert len(scripts) == 9
          for script in scripts:
              runpy.run_path(str(script), init_globals={'edit': edit})
          assert len(pending) == 18 and len({str(p) for p, _ in pending}) == 18
          for target, out in pending:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(out)
          subprocess.run(['git', 'add', '--', *[str(p) for p, _ in pending]], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.github/studio-publication', '.github/studio-edits.part1'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Redesign local author studio and consent-first metering lifecycle'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:work/web-author-redesign'], check=True)
          PY
      - name: Python and official cloze regression
        run: |
          mkdir -p adjusted/.local/studio-review
          python -B -m unittest discover -s adjusted/tests -v 2>&1 | tee adjusted/.local/studio-review/core-tests.txt
          python -B -m unittest discover -s adjusted/tests/web_author -v 2>&1 | tee adjusted/.local/studio-review/web-tests.txt
          python -B adjusted/tools/check_official_cloze.py | tee adjusted/.local/studio-review/cloze-test.txt
          node --check adjusted/web-author/web/app.js
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Native browser regression on synthetic projects
        run: python adjusted/tests/web_author/test_wizard_browser.py
      - name: Archive exact reviewed sources
        if: always()
        run: git archive HEAD -o tested-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-redesign-review
          path: |
            tested-source.zip
            adjusted/.local/studio-review/
          retention-days: 3
