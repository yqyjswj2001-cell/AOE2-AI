name: Author efficiency review
on:
  push:
    branches: [fix/author-workflow-efficiency]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive HEAD -o efficiency-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: efficiency-source
          path: efficiency-source.zip
          retention-days: 3
